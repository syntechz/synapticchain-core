name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Deployment notification
      run: |
        echo "🚀 SynapticChain Core updated on main"
        echo "Commit: ${{ github.sha }}"
        echo "Author: ${{ github.actor }}"
        echo "Changed: $(git diff --name-only HEAD~1 | wc -l) files"
